<h2>Anime Super Component</h2>
<section class="row">
  <div class="col-12 col-sm-6">
    <!-- Inicia componente formulario -->
    <app-character-form (newCharacter)="variosService.addCharacter($event)"></app-character-form>
    <!-- finaliza componente formulario -->
  </div>
  <div class="col-12 col-sm-6">
    <!-- inicia componente lista -->
    <app-character-list listName="Listado de Personajes" [characters]="variosService.characters()"></app-character-list>
    <!-- finaliza componente lista -->
  </div>
</section>
