<h3>Agregar {{ name() }} - {{ power() }}</h3>

<input
  type="text"
  placeholder="Nombre"
  class="form-control mb-2"
  [value]="name()"
  (change)="name.set(txtName.value)"
  (input)="name.set(txtName.value)"
  #txtName
/>
<input
  type="number"
  placeholder="Poder"
  class="form-control mb-2"
  [value]="power()"
  (input)="power.set(+txtPower.value)"
  #txtPower
/>
<button class="btn btn-primary mb-2" (click)="addCharacter()">Agregar</button>
